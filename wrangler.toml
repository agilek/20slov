# Jeden Worker servíruje hru i API. Statika je v public/, worker si bere
# /api/* (a později /prihlaseni a /u/*), zbytek propadne na soubory.
# Díky tomu je hra i API na stejné doméně → žádné CORS a session může být
# HttpOnly cookie, kterou JS nepřečte.
name = "20slov"
main = "worker/src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true
routes = [{ pattern = "20slov.cz", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# Neznámá cesta dostane public/404.html se stavem 404 (ne holou chybu).
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/prihlaseni", "/u/*", "/ingest/*"]

[[d1_databases]]
binding = "DB"
database_name = "20slov"
database_id = "45f2e2ce-3da8-42f6-87be-00120dc5c006"

[triggers]
# 7:00 UTC ≈ 8-9 ráno v ČR — jednou denně pošle Web Push připomínku odběratelům.
crons = ["0 7 * * *"]
